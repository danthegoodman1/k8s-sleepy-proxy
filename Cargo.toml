[workspace]
members = ["crates/control-plane", "crates/frontline", "crates/proxy-core", "crates/sidecar", "crates/sleepypods-types"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
bytes = { version = "1.12.0", default-features = false }
control-plane = { version = "0.1.0", path = "crates/control-plane" }
criterion = { version = "0.8.2", default-features = false }
futures-util = { version = "0.3.32", default-features = false }
http = { version = "1.4.2", default-features = false }
http-body = { version = "1.0.1", default-features = false }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.10.1", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
proxy-core = { version = "0.1.0", path = "crates/proxy-core" }
sleepypods-types = { version = "0.1.0", path = "crates/sleepypods-types" }
tokio = { version = "1.52.3", default-features = false }
tokio-tungstenite = { version = "0.29.0", default-features = false }
tonic = { version = "0.14.6", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
