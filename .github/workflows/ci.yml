name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sleepypods
          POSTGRES_USER: sleepypods
          POSTGRES_PASSWORD: sleepypods
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleepypods -d sleepypods"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Check production dependency boundaries
        run: python3 scripts/test-dependency-boundaries.py

      - name: Test fail-closed soak inventory
        run: python3 scripts/test-full-wake-sleep-inventory.py

      - name: Test PostgreSQL execution checker
        run: python3 scripts/test-postgres-execution.py

      - name: Test protocol fixture over HTTP/2 and WebSocket
        run: cargo test --locked -p proxy-core --example kind_protocol_app

      - name: Check load helpers with isolated package features
        run: |
          cargo check --locked -p frontline --example frontline_load_smoke
          cargo check --locked -p sidecar --example sidecar_load_smoke

      - name: Test Postgres store
        env:
          SLEEPYPODS_POSTGRES_URL: postgres://sleepypods:sleepypods@localhost:5432/sleepypods
        run: |
          set -o pipefail
          cargo test --locked -p control-plane --test postgres_store -- --nocapture --color never 2>&1 | tee postgres-store.out
          python3 scripts/check-postgres-execution.py postgres-store.out
