[package]
name = "frontline"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { workspace = true, default-features = false }
control-plane = { workspace = true }
http = { workspace = true, default-features = false, features = ["std"] }
http-body = { workspace = true, default-features = false }
http-body-util = { workspace = true, default-features = false, features = ["full"] }
hyper = { workspace = true, default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, default-features = false, features = ["tokio", "http1", "http2", "server-auto"] }
proxy-core = { workspace = true }
rustls-pemfile = "2.2.0"
tokio = { workspace = true, default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tonic = { workspace = true, default-features = false, features = ["transport"] }

[dev-dependencies]
criterion = { workspace = true, default-features = false }
futures-util = { workspace = true, default-features = false, features = ["sink", "std"] }
http-body-util = { workspace = true, default-features = false, features = ["channel", "full"] }
hyper = { workspace = true, default-features = false, features = ["client", "server", "http1", "http2"] }
hyper-util = { workspace = true, default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
tokio = { workspace = true, default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-tungstenite = { workspace = true, default-features = false, features = ["connect", "handshake"] }

[[bench]]
name = "route_lookup"
harness = false
