[package]
name = "frontline"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { version = "1.12.0", default-features = false }
control-plane = { version = "0.1.0", path = "../control-plane" }
http = { version = "1.4.2", default-features = false, features = ["std"] }
http-body = { version = "1.0.1", default-features = false }
http-body-util = { version = "0.1.3", default-features = false, features = ["full"] }
hyper = { version = "1.10.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "http1"] }
proxy-core = { version = "0.1.0", path = "../proxy-core" }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
http-body-util = { version = "0.1.3", default-features = false, features = ["channel", "full"] }
hyper = { version = "1.10.1", default-features = false, features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring"] }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }

[[bench]]
name = "route_lookup"
harness = false
