[package]
name = "control-plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
deadpool-postgres = "0.14.1"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.0.0", default-features = false, features = ["client", "rustls-tls"] }
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sleepypods-types = { version = "0.1.0", path = "../sleepypods-types" }
tokio = { version = "1.52.3", features = ["time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tonic-web = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
bytes = "1.12.0"
http-body-util = "0.1.3"
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
