[package]
name = "control-plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
deadpool-postgres = "0.14.1"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.0.0", default-features = false, features = ["client", "rustls-tls"] }
prost = "0.14.4"
proxy-core = { workspace = true }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sleepypods-types = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tonic = { workspace = true, default-features = true, features = ["transport"] }
tonic-prost = "0.14.6"
tonic-web = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
bytes = { workspace = true, default-features = true }
futures-util = { workspace = true, default-features = false, features = ["sink", "std"] }
http = { workspace = true, default-features = false, features = ["std"] }
http-body-util = { workspace = true, default-features = true }
hyper = { workspace = true, default-features = false, features = ["client", "http2"] }
hyper-util = { workspace = true, default-features = false, features = ["tokio"] }
tokio = { workspace = true, default-features = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true, default-features = false, features = ["connect", "handshake"] }
