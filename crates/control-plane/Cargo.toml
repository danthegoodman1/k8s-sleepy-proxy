[package]
name = "control-plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
deadpool-postgres = "0.14.1"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.0.0", default-features = false, features = ["client", "rustls-tls"] }
prost = "0.14.4"
proxy-core = { version = "0.1.0", path = "../proxy-core" }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sleepypods-types = { version = "0.1.0", path = "../sleepypods-types" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tonic-web = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
bytes = "1.12.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
http = { version = "1.4.2", default-features = false, features = ["std"] }
http-body-util = "0.1.3"
hyper = { version = "1.10.1", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
