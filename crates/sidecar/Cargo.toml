[package]
name = "sidecar"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { version = "1.12.0", default-features = false }
control-plane = { version = "0.1.0", path = "../control-plane" }
http = { version = "1.4.2", default-features = false, features = ["std"] }
http-body = { version = "1.0.1", default-features = false }
http-body-util = { version = "0.1.3", default-features = false, features = ["full"] }
hyper = { version = "1.10.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "http1"] }
proxy-core = { version = "0.1.0", path = "../proxy-core" }
sleepypods-types = { version = "0.1.0", path = "../sleepypods-types" }
tokio = { version = "1.52.3", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time", "test-util"] }
