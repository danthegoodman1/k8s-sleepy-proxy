[package]
name = "proxy-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { version = "1.12.0", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
http = { version = "1.4.2", default-features = false, features = ["std"] }
http-body = { version = "1.0.1", default-features = false }
hyper = { version = "1.10.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
pin-project-lite = { version = "0.2.17", default-features = false }
tls-parser = { version = "0.12.2", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"], default-features = false }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.10.1", default-features = false, features = ["server"] }
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "test-util"] }

[[bench]]
name = "proxy_primitives"
harness = false
